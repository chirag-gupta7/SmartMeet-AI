<svg xmlns="http://www.w3.org/2000/svg" width="850" height="800" viewBox="0 0 850 800" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#93C5FD"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="850" height="800" rx="16" fill="#FBFCFF"/>

  <!-- title pill -->
  <rect x="245" y="26" width="360" height="44" rx="22" fill="url(#brandGrad)" filter="url(#softShadow)"/>
  <text x="425" y="54" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="3">VOICE COMMAND PIPELINE</text>

  <!-- spine -->
  <line x1="90" y1="130" x2="90" y2="670" stroke="#DBEAFE" stroke-width="4"/>

  <!-- STEP 1 -->
  <circle cx="90" cy="130" r="24" fill="#1D4ED8" filter="url(#softShadow)"/>
  <text x="90" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
  <rect x="140" y="92" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="92" width="6" height="76" rx="3" fill="#1D4ED8"/>
  <text x="168" y="121" font-size="16.5" font-weight="700" fill="#0F172A">Speak</text>
  <text x="168" y="147" font-size="13.5" fill="#475569">User talks to the app — Web Speech API converts speech to text in the browser</text>

  <!-- STEP 2 -->
  <circle cx="90" cy="238" r="24" fill="#2563EB" filter="url(#softShadow)"/>
  <text x="90" y="245" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
  <rect x="140" y="200" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="200" width="6" height="76" rx="3" fill="#2563EB"/>
  <text x="168" y="229" font-size="16.5" font-weight="700" fill="#0F172A">Send</text>
  <text x="168" y="255" font-size="13.5" fill="#475569">POST /api/voice/process with the transcript, authenticated by JWT</text>

  <!-- STEP 3 -->
  <circle cx="90" cy="346" r="24" fill="#3B82F6" filter="url(#softShadow)"/>
  <text x="90" y="353" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
  <rect x="140" y="308" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="308" width="6" height="76" rx="3" fill="#3B82F6"/>
  <text x="168" y="337" font-size="16.5" font-weight="700" fill="#0F172A">Understand</text>
  <text x="168" y="363" font-size="13.5" fill="#475569">Llama 3 on HuggingFace classifies intent — schedule_meeting · weather · general_response</text>

  <!-- STEP 4 -->
  <circle cx="90" cy="454" r="24" fill="#6366F1" filter="url(#softShadow)"/>
  <text x="90" y="461" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
  <rect x="140" y="416" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="416" width="6" height="76" rx="3" fill="#6366F1"/>
  <text x="168" y="445" font-size="16.5" font-weight="700" fill="#0F172A">Act</text>
  <text x="168" y="471" font-size="13.5" fill="#475569">Command processor does the real work — calendar events · notes · timers · weather · math</text>

  <!-- STEP 5 -->
  <circle cx="90" cy="562" r="24" fill="#7C3AED" filter="url(#softShadow)"/>
  <text x="90" y="569" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">5</text>
  <rect x="140" y="524" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="524" width="6" height="76" rx="3" fill="#7C3AED"/>
  <text x="168" y="553" font-size="16.5" font-weight="700" fill="#0F172A">Reply</text>
  <text x="168" y="579" font-size="13.5" fill="#475569">A natural-language answer is composed, with heuristic fallbacks when the LLM is offline</text>

  <!-- STEP 6 -->
  <circle cx="90" cy="670" r="24" fill="#8B5CF6" filter="url(#softShadow)"/>
  <text x="90" y="677" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">6</text>
  <rect x="140" y="632" width="650" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#softShadow)"/>
  <rect x="140" y="632" width="6" height="76" rx="3" fill="#8B5CF6"/>
  <text x="168" y="661" font-size="16.5" font-weight="700" fill="#0F172A">Speak back</text>
  <text x="168" y="687" font-size="13.5" fill="#475569">ElevenLabs synthesizes the reply as audio; the frontend plays the returned MP3</text>

  <!-- flow arrows between badges -->
  <line x1="90" y1="156" x2="90" y2="212" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="264" x2="90" y2="320" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="372" x2="90" y2="428" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="480" x2="90" y2="536" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="588" x2="90" y2="644" stroke="#93C5FD" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
